<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ücretsiz Metin Seslendirici & İndirici</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .kutu {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #4da6ff;
        }
        textarea {
            width: 100%;
            height: 130px;
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 15px;
        }
        select, input[type="range"], input[type="text"] {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .ayar-satiri {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            color: #bbb;
        }
        .butonlar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .oku-btn {
            background-color: #4da6ff;
            color: #000;
        }
        .oku-btn:hover { background-color: #3399ff; }
        .durdur-btn {
            background-color: #ff4d4d;
            color: #fff;
        }
        .durdur-btn:hover { background-color: #e60000; }
        .indir-btn {
            background-color: #2ecc71;
            color: #000;
        }
        .indir-btn:hover { background-color: #27ae60; }
        .kayit-btn {
            background-color: #f39c12;
            color: #000;
        }
        .kayit-btn:hover { background-color: #d68910; }
        .durum {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-top: 10px;
            min-height: 18px;
        }
        hr {
            border: 0;
            border-top: 1px solid #333;
            margin: 18px 0;
        }
    </style>
</head>
<body>

<div class="kutu">
    <h2>🔊 Metinden Sese & MP3 İndirici</h2>
    
    <textarea id="metin" placeholder="Buraya okunmasını veya indirilmesini istediğin metni yaz..."></textarea>
    
    <div class="ayar-satiri">
        <label for="sesSecimi">Dinleme Sesi / Dili:</label>
    </div>
    <select id="sesSecimi"></select>

    <div class="ayar-satiri">
        <span>Okuma Hızı:</span>
        <span id="hizDegeri">1.0x</span>
    </div>
    <input type="range" id="hiz" min="0.5" max="2" value="1" step="0.1">

    <div class="butonlar">
        <button class="oku-btn" onclick="metniOku()">▶ Dinle</button>
        <button class="durdur-btn" onclick="okumayiDurdur()">⏹ Durdur</button>
    </div>

    <hr>

    <div class="ayar-satiri">
        <label for="dosyaAdi">İndirilecek Dosya Adı (.mp3):</label>
    </div>
    <input type="text" id="dosyaAdi" value="seslendirme" placeholder="Dosya adını yaz (örn: dublaj_1)">

    <div class="butonlar">
        <button class="indir-btn" onclick="mp3Indir()">⬇ MP3 Olarak İndir</button>
        <button class="kayit-btn" onclick="sekmeSesiKaydet()">🎙 Sekme Sesini Kaydet</button>
    </div>

    <div class="durum" id="durumYazisi">Hazır.</div>
</div>

<script>
    const synth = window.speechSynthesis;
    const sesSecimi = document.getElementById('sesSecimi');
    const hizInput = document.getElementById('hiz');
    const hizDegeri = document.getElementById('hizDegeri');
    const durumYazisi = document.getElementById('durumYazisi');
    let sesler = [];

    function sesleriYukle() {
        sesler = synth.getVoices();
        sesSecimi.innerHTML = '';

        sesler.forEach((ses, index) => {
            const option = document.createElement('option');
            option.textContent = `${ses.name} (${ses.lang})`;
            option.value = index;
            option.dataset.lang = ses.lang;
            
            if (ses.lang.includes('tr')) {
                option.selected = true;
            }
            sesSecimi.appendChild(option);
        });
    }

    sesleriYukle();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = sesleriYukle;
    }

    hizInput.addEventListener('input', () => {
        hizDegeri.textContent = hizInput.value + 'x';
    });

    function metniOku() {
        const metin = document.getElementById('metin').value;
        if (!metin.trim()) {
            durumYazisi.textContent = "Lütfen önce bir metin yaz.";
            return;
        }

        synth.cancel();
        const konusma = new SpeechSynthesisUtterance(metin);
        const secilenSesIndex = sesSecimi.value;
        
        if (sesler[secilenSesIndex]) {
            konusma.voice = sesler[secilenSesIndex];
        }
        
        konusma.rate = parseFloat(hizInput.value);
        durumYazisi.textContent = "Okunuyor...";
        konusma.onend = () => durumYazisi.textContent = "Okuma tamamlandı.";
        synth.speak(konusma);
    }

    function okumayiDurdur() {
        synth.cancel();
        durumYazisi.textContent = "Durduruldu.";
    }

    // Uzun metinleri 200 karakterlik anlamlı parçalara böler (Google TTS sınırı için)
    function metniParcala(metin, maxUzunluk = 180) {
        const kelimeler = metin.split(/\s+/);
        const parcalar = [];
        let mevcutParca = "";

        for (const kelime of kelimeler) {
            if ((mevcutParca + " " + kelime).trim().length <= maxUzunluk) {
                mevcutParca = (mevcutParca + " " + kelime).trim();
            } else {
                if (mevcutParca) parcalar.push(mevcutParca);
                mevcutParca = kelime;
            }
        }
        if (mevcutParca) parcalar.push(mevcutParca);
        return parcalar;
    }

    // Doğrudan Google TTS üzerinden MP3 birleştirip indirir
    async function mp3Indir() {
        const metin = document.getElementById('metin').value.trim();
        if (!metin) {
            durumYazisi.textContent = "İndirmek için önce metin yazmalısın.";
            return;
        }

        let dosyaAdi = document.getElementById('dosyaAdi').value.trim() || "seslendirme";
        if (!dosyaAdi.toLowerCase().endsWith('.mp3')) {
            dosyaAdi += '.mp3';
        }

        // Seçili dilin kodunu al (örn: tr-TR -> tr)
        const seciliOption = sesSecimi.options[sesSecimi.selectedIndex];
        const dilKodu = seciliOption && seciliOption.dataset.lang ? seciliOption.dataset.lang.split('-')[0] : 'tr';

        durumYazisi.textContent = "Ses oluşturuluyor, lütfen bekle...";

        try {
            const parcalar = metniParcala(metin);
            const sesBlobları = [];

            for (let i = 0; i < parcalar.length; i++) {
                durumYazisi.textContent = `Parça işleniyor (${i + 1}/${parcalar.length})...`;
                const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${dilKodu}&q=${encodeURIComponent(parcalar[i])}`;
                const yanit = await fetch(url);
                if (!yanit.ok) throw new Error("Bağlantı engellendi.");
                const blob = await yanit.blob();
                sesBlobları.push(blob);
            }

            // Tüm MP3 parçalarını tek bir dosyada birleştir
            const birlesikMp3 = new Blob(sesBlobları, { type: 'audio/mpeg' });
            const indirmeLinki = document.createElement('a');
            indirmeLinki.href = URL.createObjectURL(birlesikMp3);
            indirmeLinki.download = dosyaAdi;
            document.body.appendChild(indirmeLinki);
            indirmeLinki.click();
            document.body.removeChild(indirmeLinki);

            durumYazisi.textContent = `✅ "${dosyaAdi}" başarıyla indirildi!`;
        } catch (hata) {
            durumYazisi.textContent = "⚠️ Doğrudan indirme tarayıcı tarafından engellendi. Sağdaki 'Sekme Sesini Kaydet' butonunu kullanabilirsin.";
        }
    }

    // Yedek Yöntem: Tarayıcıdaki herhangi bir sesi doğrudan kaydedip indirir
    async function sekmeSesiKaydet() {
        const metin = document.getElementById('metin').value.trim();
        if (!metin) {
            durumYazisi.textContent = "Önce okunacak metni yaz.";
            return;
        }

        let dosyaAdi = document.getElementById('dosyaAdi').value.trim() || "kayit";
        if (!dosyaAdi.toLowerCase().endsWith('.mp3')) {
            dosyaAdi += '.mp3';
        }

        try {
            durumYazisi.textContent = "Açılan pencerede 'Bu Sekme'yi seçip 'Sekme sesini paylaş'ı işaretle...";
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: true
            });

            const audioTrack = stream.getAudioTracks()[0];
            if (!audioTrack) {
                stream.getTracks().forEach(t => t.stop());
                durumYazisi.textContent = "❌ Ses paylaşımı işaretlenmedi!";
                return;
            }

            const audioStream = new MediaStream([audioTrack]);
            const mediaRecorder = new MediaRecorder(audioStream);
            const chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/mpeg' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = dosyaAdi;
                a.click();
                stream.getTracks().forEach(t => t.stop());
                durumYazisi.textContent = `✅ "${dosyaAdi}" kaydedildi ve indirildi!`;
            };

            mediaRecorder.start();
            durumYazisi.textContent = "🎙 Kaydediliyor ve okunuyor...";

            synth.cancel();
            const konusma = new SpeechSynthesisUtterance(metin);
            const secilenSesIndex = sesSecimi.value;
            if (sesler[secilenSesIndex]) konusma.voice = sesler[secilenSesIndex];
            konusma.rate = parseFloat(hizInput.value);

            konusma.onend = () => {
                setTimeout(() => mediaRecorder.stop(), 400);
            };

            synth.speak(konusma);
        } catch (err) {
            durumYazisi.textContent = "Kayıt iptal edildi.";
        }
    }
</script>

</body>
</html>
